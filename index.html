<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Notes</title>

<style>
:root{
    --background:#f7f8fa;
    --surface:#ffffff;
    --border:#e5e7eb;
    --text:#111827;
    --secondary:#6b7280;
    --shadow:0 8px 24px rgba(0,0,0,.06);
    --radius:18px;
    --max-width:1200px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

    background:var(--background);
    color:var(--text);
}

.container{
    width:min(95%, var(--max-width));
    margin:auto;
    padding:60px 0;
}

header{
    margin-bottom:40px;
}

h1{
    font-size:2.4rem;
    font-weight:700;
}

.subtitle{
    margin-top:10px;
    color:var(--secondary);
    font-size:1rem;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:24px;
}

.card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px;

    cursor:pointer;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;

    box-shadow:var(--shadow);

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    min-height:170px;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#d1d5db;
    box-shadow:
        0 18px 40px rgba(0,0,0,.10);
}

.card h2{
    font-size:1.2rem;
    margin-bottom:12px;
}

.card p{
    color:var(--secondary);
    line-height:1.5;
}

footer{
    text-align:center;
    margin-top:70px;
    color:var(--secondary);
    font-size:.9rem;
}

.loading{
    text-align:center;
    color:var(--secondary);
    padding:60px;
}

.error{
    color:#dc2626;
}
</style>
</head>
<body>

<div class="container">

<header>
    <h1>My Notes</h1>
    <p class="subtitle">
        A collection of technical notes.
    </p>
</header>

<div id="notes" class="grid">
    <div class="loading">
        Loading notes...
    </div>
</div>

<footer>
    Built with HTML + JSON + GitHub Pages
</footer>

</div>

<script>
async function loadNotes() {

    const container = document.getElementById("notes");

    try {

        const response = await fetch("notes.json");

        if (!response.ok)
            throw new Error("Unable to load notes.json");

        const notes = await response.json();

        container.innerHTML = "";

        notes.forEach(note => {

            const card = document.createElement("div");

            card.className = "card";

            card.innerHTML = `
                <div>
                    <h2>${note.name}</h2>
                    <p>${note.description}</p>
                </div>
            `;

            card.addEventListener("click", () => {
                window.location.href = note.url;
            });

            container.appendChild(card);

        });

    }
    catch (err) {

        container.innerHTML = `
            <div class="loading error">
                ${err.message}
            </div>
        `;

        console.error(err);

    }

}

loadNotes();
</script>

</body>
</html>
